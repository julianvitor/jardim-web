<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardim Web - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800 antialiased selection:bg-emerald-200">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 border border-gray-100 mx-4">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center text-3xl font-bold text-emerald-600">
                <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                Jardim Web
            </a>
            <h2 class="mt-4 text-xl font-semibold text-gray-700">Bem-vindo de volta!</h2>
            <p class="text-sm text-gray-500 mt-1">Acesse sua conta para monitorar seu jardim.</p>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required 
                    class="mt-2 block w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all"
                    placeholder="voce@exemplo.com">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" id="password" name="password" required 
                    class="mt-2 block w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all"
                    placeholder="••••••••">
                <div class="mt-2 flex justify-end">
                    <a href="#" class="text-sm text-emerald-600 hover:text-emerald-700">Esqueceu a senha?</a>
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                Entrar
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Não tem uma conta? 
            <a href="register.html" class="font-semibold text-emerald-600 hover:text-emerald-500">Registre-se</a>
        </p>
    </div>

</body>
</html>
